# ═══════════════════════════════════════════════════════════════════════════════
# CI + Release workflow for Super Minimal Linux Libre
#
# Builds both x86_64 and arm64 userland + kernel on an x86_64 GitHub runner,
# creates disk images, runs QEMU smoke tests, and publishes GitHub Releases
# on tag push.
#
# Caching strategy (3 layers):
#   1. sources-patched/ — patched source trees (shared across arches)
#   2. ccache — compiler object cache (per-arch)
#   3. sources-build/ — full build output + stamp files (per-arch, most impactful)
#
# Prerequisites:
#   - Most submodules use HTTPS; linux-libre uses git:// (FSFLA limitation)
#   - GitHub Actions runners support git:// protocol on port 9418
#   - If linux-libre fetch fails, mirror it to GitHub and update .gitmodules
# ═══════════════════════════════════════════════════════════════════════════════

name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*", "release-*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch (but not tags)
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, arm64]
      fail-fast: false

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      # linux-libre uses git:// protocol (FSFLA doesn't serve HTTPS).
      # actions/checkout@v4 struggles with git:// submodules on runners,
      # so we init them manually after checkout.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize submodules
        # Shallow, pinned-commit fetch, one submodule at a time with retries.
        # Full `git submodule update --init --recursive` hits HTTP 429/500
        # from the GNU hosts and clones ~GBs of history.
        run: scripts/fetch-submodules.sh

      # ── Cache keys ────────────────────────────────────────────────────────
      - name: Compute cache keys
        id: cache-keys
        run: |
          # Hash of submodule SHAs → invalidates when source code versions change
          SUBMODULE_HASH=$(git submodule status | sha256sum | cut -d' ' -f1)
          echo "submodule-hash=${SUBMODULE_HASH}" >> "$GITHUB_OUTPUT"

          # Hash of build configuration → invalidates when build rules change
          CONFIG_HASH=$( (sha256sum mk/*.mk kernel-*.config .gitmodules 2>/dev/null) | sha256sum | cut -d' ' -f1)
          echo "config-hash=${CONFIG_HASH}" >> "$GITHUB_OUTPUT"

          echo "submodule-hash=${SUBMODULE_HASH}"
          echo "config-hash=${CONFIG_HASH}"

      # ── Cache: sources-patched/ ────────────────────────────────────────────
      # Patched source trees (shared across arches). Keyed on submodule SHAs
      # + patch files + mk rules that control patching.
      - name: Cache sources-patched
        uses: actions/cache@v4
        with:
          path: sources-patched
          key: sources-patched-${{ steps.cache-keys.outputs.submodule-hash }}-${{ hashFiles('sources-patches/**', 'mk/03-source-prep.mk') }}
          restore-keys: |
            sources-patched-${{ steps.cache-keys.outputs.submodule-hash }}-
            sources-patched-

      # ── Cache: ccache ─────────────────────────────────────────────────────
      # Compiler object cache (per-arch). Survives minor config changes via
      # restore-keys fallback.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.arch }}-${{ steps.cache-keys.outputs.config-hash }}
          restore-keys: |
            ccache-${{ matrix.arch }}-
          enableCrossOsArchive: true

      # ── Cache: build output ────────────────────────────────────────────────
      # Full per-arch build directories with `.built` stamp files. When the
      # cache hits, `make` finds all stamp files and skips everything — saving
      # 30-45 minutes. Keyed on submodule SHAs + config so it auto-invalidates.
      - name: Cache build output (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: sources-build/${{ matrix.arch }}
          key: build-${{ matrix.arch }}-${{ steps.cache-keys.outputs.submodule-hash }}-${{ steps.cache-keys.outputs.config-hash }}
          restore-keys: |
            build-${{ matrix.arch }}-${{ steps.cache-keys.outputs.submodule-hash }}-
            build-${{ matrix.arch }}-
          enableCrossOsArchive: true

      # ── Toolchain ─────────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            make gcc ccache \
            autoconf automake libtool \
            gettext texinfo \
            patch xz-utils rsync bc \
            elfutils libelf-dev \
            e2fsprogs file

          # Cross-compiler for arm64 (needed on x86_64 host)
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

          # QEMU for testing
          sudo apt-get install -y -qq \
            qemu-system-x86 qemu-system-arm

      - name: Set up ccache
        run: |
          # Create ccache wrappers for native + cross compilers
          sudo mkdir -p /usr/lib/ccache
          sudo ln -sf /usr/bin/ccache /usr/lib/ccache/gcc
          sudo ln -sf /usr/bin/ccache /usr/lib/ccache/g++
          sudo ln -sf /usr/bin/ccache /usr/lib/ccache/cc
          sudo ln -sf /usr/bin/ccache /usr/lib/ccache/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/ccache /usr/lib/ccache/aarch64-linux-gnu-g++
          sudo ln -sf /usr/bin/ccache /usr/lib/ccache/aarch64-linux-gnu-cpp

          # Put the wrappers first on PATH for all later steps. (A step-level
          # `PATH: "/usr/lib/ccache:${{ env.PATH }}"` breaks PATH: env.PATH only
          # holds workflow-defined variables, so it expands to empty.)
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          # Configure ccache
          ccache --max-size=500M
          ccache --zero-stats 2>/dev/null || true

          # Show stats
          echo "=== ccache config ==="
          ccache --show-config | grep -E 'cache_dir|max_size'
          echo "=== ccache initial stats ==="
          ccache --show-stats || true

      - name: Show toolchain info
        run: |
          echo "=== Host ==="
          gcc -dumpmachine
          gcc --version | head -1
          echo "=== Cross ==="
          aarch64-linux-gnu-gcc --version | head -1
          echo "=== make ==="
          make --version | head -1
          echo "=== QEMU ==="
          qemu-system-x86_64 --version | head -1
          qemu-system-aarch64 --version | head -1
          echo "=== ccache ==="
          ccache --version | head -1

      - name: Check build environment
        run: |
          make check-env

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build ${{ matrix.arch }} userland + kernel
        run: |
          # If build cache restored .built stamps, make will skip everything
          # and print "Nothing to be done".  That's the win.
          echo "=== make userland-${{ matrix.arch }} ==="
          make ARCH=${{ matrix.arch }} userland-${{ matrix.arch }}

          echo "=== make kernel-${{ matrix.arch }} ==="
          make ARCH=${{ matrix.arch }} kernel

      - name: Install ${{ matrix.arch }} to rootfs
        run: |
          make ARCH=${{ matrix.arch }} install-${{ matrix.arch }}
          make ARCH=${{ matrix.arch }} install-kernel-${{ matrix.arch }}

      # ── ccache stats (diagnostic) ─────────────────────────────────────────
      - name: Show ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "=== ccache final stats ==="
            ccache --show-stats
          else
            echo "=== ccache not available ==="
          fi

      # ── Disk Image ────────────────────────────────────────────────────────
      - name: Create ${{ matrix.arch }} disk image
        run: |
          make disk-image-${{ matrix.arch }}
          ls -lh disks/

      # ── Stage release files ───────────────────────────────────────────────
      # Final asset names, one artifact per arch: the test job boots exactly
      # these files and the release job publishes them.
      - name: Stage ${{ matrix.arch }} release files
        run: |
          A=${{ matrix.arch }}
          K=sources-build/$A/linux-libre
          mkdir -p release
          cp disks/disk-$A.img release/linux-libre-vm-$A.img
          if [ "$A" = x86_64 ]; then
            cp $K/arch/x86/boot/bzImage release/linux-libre-vmlinuz-$A
          else
            cp $K/arch/arm64/boot/Image.gz release/linux-libre-vmlinuz-$A
          fi
          cp $K/.config release/linux-libre-$A.config
          cp $K/System.map release/linux-libre-$A.System.map
          scripts/release-manifest.sh $A > release/MANIFEST-$A.txt
          ls -lh release/
          sed -n '1,/^## Files/p' release/MANIFEST-$A.txt

      - name: Upload ${{ matrix.arch }} release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  # ── Boot test ─────────────────────────────────────────────────────────────
  # Boots the staged image under QEMU, logs in on the serial console and runs
  # commands (vm/qemu.sh exec). Fails the run, and so blocks the release, when
  # the system does not come up.
  test:
    name: Boot test (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, arm64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm
          # KVM for the x86_64 guest (the arm64 guest is emulated: TCG)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Download ${{ matrix.arch }} release files
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release/

      - name: Boot and run commands on the serial console
        env:
          ARCH: ${{ matrix.arch }}
          KERNEL: release/linux-libre-vmlinuz-${{ matrix.arch }}
          DISK: release/linux-libre-vm-${{ matrix.arch }}.img
          SNAPSHOT: 1     # do not modify the image that gets released
          TIMEOUT: 300    # arm64 boots under TCG emulation here
        run: |
          vm/qemu.sh start
          vm/qemu.sh exec 'uname -sr' 'cat /proc/cmdline' \
            'test -w / && echo rootfs-writable' 'ls /bin | wc -l' | tee boot.log
          vm/qemu.sh stop
          grep -q '^Linux .*gnu' boot.log || { echo "::error::kernel did not report linux-libre"; exit 1; }
          grep -q '^rootfs-writable' boot.log || { echo "::error::root filesystem is not writable"; exit 1; }

      - name: QEMU log
        if: failure()
        run: cat build/qemu/*/qemu.log || true

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      # The images contain GPL software (Linux-libre, bash, coreutils, ...):
      # publish the exact corresponding source next to them. GitHub's own
      # "Source code" archives do not include submodules.
      - name: Fetch sources
        run: scripts/fetch-submodules.sh

      - name: Source tarball
        run: |
          tar --exclude=.git --exclude=sources/toolchain \
            --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            --transform "s|^|linux-libre-vm-${GITHUB_REF_NAME}/|" \
            -cf - Makefile README.md mk scripts templates kernel-*.config \
                  sources sources-patches vm docs |
            xz -T0 -6 > release/linux-libre-vm-src-${GITHUB_REF_NAME}.tar.xz

      - name: Compress disk images
        run: xz -T0 -9 -k release/linux-libre-vm-*.img

      - name: Create checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Generate release notes
        run: |
          T=${GITHUB_REF_NAME}
          cat > release-notes.md <<EOF
          ## Super Minimal Linux Libre ${T}

          Minimal GNU/Linux system: Linux-libre kernel, GNU userland, glibc, runit.
          Both images boot straight to a root shell on the serial console and
          configure \`eth0\` by DHCP.

          ### Run it

          With this repository (UTM on Apple Silicon, or QEMU anywhere): the VM
          scripts download this release by default.

          \`\`\`bash
          make utm-create utm-start utm-console        # macOS + UTM, arm64
          make qemu-start qemu-console                 # QEMU, arm64 (QEMU_ARCH=x86_64 for the other)
          \`\`\`

          With plain QEMU (\`unxz\` the images first, or use the uncompressed ones):

          \`\`\`bash
          # x86_64 (q35, virtio-pci)
          qemu-system-x86_64 -M q35 -m 256 -nographic -nodefaults -serial mon:stdio \\
            -kernel linux-libre-vmlinuz-x86_64 -append "root=/dev/vda rw console=ttyS0" \\
            -drive file=linux-libre-vm-x86_64.img,format=raw,if=none,id=drive0 \\
            -device virtio-blk-pci,drive=drive0 \\
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0

          # arm64 (virt, virtio-mmio: the kernel has no PCI)
          qemu-system-aarch64 -M virt -cpu cortex-a57 -m 256 -nographic -nodefaults -serial mon:stdio \\
            -kernel linux-libre-vmlinuz-arm64 -append "root=/dev/vda rw console=ttyAMA0" \\
            -drive file=linux-libre-vm-arm64.img,format=raw,if=none,id=drive0 \\
            -device virtio-blk-device,drive=drive0 \\
            -netdev user,id=net0 -device virtio-net-device,netdev=net0
          \`\`\`

          Add \`-accel kvm -cpu host\` (Linux, same architecture) or \`-accel hvf -cpu host\`
          (macOS, arm64) for hardware acceleration. Quit with Ctrl-a x.

          ### Assets

          | File | Description |
          |------|-------------|
          | \`linux-libre-vm-{x86_64,arm64}.img.xz\` | root filesystem: raw ext4, no partition table (xz) |
          | \`linux-libre-vm-{x86_64,arm64}.img\` | the same, uncompressed |
          | \`linux-libre-vmlinuz-{x86_64,arm64}\` | kernel (x86_64 bzImage, arm64 Image.gz), booted directly |
          | \`linux-libre-{x86_64,arm64}.config\` | kernel configuration |
          | \`linux-libre-{x86_64,arm64}.System.map\` | kernel symbol map (for debugging) |
          | \`MANIFEST-{x86_64,arm64}.txt\` | upstream versions, toolchain, host libraries, file list |
          | \`linux-libre-vm-src-${T}.tar.xz\` | complete corresponding source: all upstream sources, patches and build system |
          | \`SHA256SUMS\` | checksums of all assets |

          glibc, libgcc and the other runtime libraries are copied from the Ubuntu
          24.04 build host; \`MANIFEST-*.txt\` lists their Ubuntu packages and
          versions, whose source is available from Ubuntu.

          ### Upstream versions

          \`\`\`
          $(sed -n '/^## Upstream sources/,/^$/p' release/MANIFEST-x86_64.txt | sed '1d;$d')
          \`\`\`
          EOF
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: false
