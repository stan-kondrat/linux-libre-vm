# ═══════════════════════════════════════════════════════════════════════════════
# CI + Release for Super Minimal Linux Libre
#
# One run builds the base images (build-base.yml) and the dev images
# (build-dev.yml) side by side, and one job publishes both together:
#
#   pull request      base images only, built and boot-tested; nothing published
#   push to main      base + dev; publishes the "edge" pre-release (replaced on
#                     every push; GitHub's "latest" release stays the newest tag)
#   push of a tag     publishes the release of that tag (v*, release-*)
#
# A commit is built once. A tag run first looks for the run of the same commit
# on main: if that run succeeded, the tag run publishes its files (artifacts,
# kept for 30 days) and builds nothing; if it is still running, the tag run
# waits for it. Only a commit that main never built successfully (or whose
# files expired) is built in the tag run itself.
#
# A tag publishes the build of its commit from `main`, made before the tag
# existed, so the dev image inside says "edge". The `retag` job writes the tag
# into the image (scripts/retag-image.sh) and compresses it again; the release
# and the container use that image.
#
# The dev image is also published as a container on ghcr.io, from the same
# build as the release's .img.xz (the rootfs-<arch> artifacts):
#
#   ghcr.io/stan-kondrat/linux-libre-vm-dev:<tag>          linux/arm64 + linux/amd64
#   ghcr.io/stan-kondrat/linux-libre-vm-dev:<tag>-<arch>   one architecture
#
# <tag> is the release tag, or "edge" on main. A per-arch image is tested
# (container-test.sh as root and uid 1000, then as a job container) before
# the multi-arch tag points at it.
# ═══════════════════════════════════════════════════════════════════════════════

name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*", "release-*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Runs of a branch queue up (a newer push replaces a waiting run, so "edge"
# follows the newest commit); pull requests cancel the run they replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  # ── find: a finished build of this commit on main ───────────────────────────
  # Tag runs only. Output run-id: the main run whose artifacts are published;
  # empty: build here.
  find:
    name: Find the main build of this commit
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event.repository.default_branch }}
          NEED: release-x86_64 release-arm64 sources dev-x86_64 dev-arm64 dev-sources rootfs-x86_64 rootfs-arm64
        run: |
          api="repos/$GITHUB_REPOSITORY/actions"
          runs() {
            gh api "$api/workflows/build-release.yml/runs?head_sha=$GITHUB_SHA&branch=$MAIN&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]'
          }
          complete() {   # run $1 still has every artifact the release needs
            have=" $(gh api "$api/runs/$1/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
            for a in $NEED; do case $have in *" $a "*) ;; *) return 1 ;; esac; done
          }
          # A tag pushed together with its commit: give the main run time to appear
          r=$(runs); [ "$(jq length <<<"$r")" -gt 0 ] || { sleep 60; r=$(runs); }
          deadline=$((SECONDS + 340 * 60))
          while :; do
            for id in $(jq -r '.[] | select(.conclusion == "success") | .id' <<<"$r"); do
              if complete "$id"; then
                echo "publishing the files of main run $id"
                echo "run-id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$r")" = 0 ]; then
              echo "no successful run of $GITHUB_SHA on $MAIN with its files: building here"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the main run of $GITHUB_SHA is still running: re-run this workflow when it has finished"
              exit 1
            fi
            echo "the main run of $GITHUB_SHA is still running; waiting"
            sleep 120
            r=$(runs)
          done

  base:
    name: Base
    needs: find
    if: needs.find.outputs.run-id == ''
    uses: ./.github/workflows/build-base.yml

  dev:
    name: Dev
    needs: find
    if: needs.find.outputs.run-id == '' && github.event_name != 'pull_request'
    uses: ./.github/workflows/build-dev.yml

  # ── retag: the dev image says the tag it is published as ────────────────────
  # Tag runs only. Per architecture: unpack the .img.xz, write the tag into the
  # image, pack it again (unchanged when it already says the tag), and keep the
  # new files and their checksums as artifacts of this run for `publish` and
  # `container`. A loop mount needs root, which the runner offers through sudo.
  retag:
    name: Dev image identity (${{ matrix.arch }})
    needs: [find, base, dev]
    if: >-
      !cancelled() && needs.find.result == 'success' &&
      github.ref_type == 'tag' &&
      (needs.find.outputs.run-id != '' ||
       (needs.base.result == 'success' && needs.dev.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    permissions:
      contents: read
      actions: read
    env:
      RUN: ${{ needs.find.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/setup-host
        with:
          free-disk: true
      - uses: actions/download-artifact@v4
        with:
          name: dev-${{ matrix.arch }}
          path: dev/
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - name: Write the tag into the image
        run: |
          scripts/retag-image.sh ${{ matrix.arch }} "$GITHUB_REF_NAME" dev out
          mkdir sha && mv out/img.sha256 sha/
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: tagged-img-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: tagged-sha-${{ matrix.arch }}
          path: sha/
          if-no-files-found: error
          retention-days: 30

  # ── publish: base + dev files into one release ──────────────────────────────
  publish:
    name: Publish ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
    needs: [find, base, dev, retag]
    if: >-
      !cancelled() && needs.find.result == 'success' &&
      (github.ref_type == 'tag' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      github.event_name != 'pull_request' &&
      (github.ref_type != 'tag' || needs.retag.result == 'success') &&
      (needs.find.outputs.run-id != '' ||
       (needs.base.result == 'success' && needs.dev.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
      RUN: ${{ needs.find.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # From this run, or from the main run that `find` chose
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: base/
          merge-multiple: true
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: base/
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          path: dev/
          merge-multiple: true
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      # A tag: the dev images that say the tag (from `retag`, this run) replace
      # the ones of the build
      - name: Drop the dev images of the build
        if: github.ref_type == 'tag'
        run: rm -f dev/linux-libre-vm-dev-*.img.xz*
      - uses: actions/download-artifact@v4
        if: github.ref_type == 'tag'
        with:
          pattern: tagged-img-*
          path: dev/
          merge-multiple: true

      # SHA256SUMS covers the base files (vm/release.sh reads it), SHA256SUMS-dev
      # the dev files
      - name: Name the source tarballs, checksums
        run: |
          mv base/linux-libre-vm-src.tar.xz "base/linux-libre-vm-src-$NAME.tar.xz"
          mv dev/linux-libre-vm-dev-src.tar.xz "dev/linux-libre-vm-dev-src-$NAME.tar.xz"
          (cd base && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          (cd dev && sha256sum * > SHA256SUMS-dev && cat SHA256SUMS-dev)
          ls -lh base dev
          [ "$RUN" = "$GITHUB_RUN_ID" ] || echo "files of run https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN"

      - name: Release notes
        run: scripts/release-notes.sh "$NAME" base > notes.md && cat notes.md

      # The tag moves with main: the old release and its tag go first
      - name: Publish edge
        if: github.ref_type != 'tag'
        run: |
          gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create edge --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Edge (main, ${GITHUB_SHA::12})" \
            --notes-file notes.md base/* dev/*

      # A re-run updates the release it created
      - name: Publish ${{ github.ref_name }}
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$NAME" --repo "$GITHUB_REPOSITORY" --clobber base/* dev/*
            gh release edit "$NAME" --repo "$GITHUB_REPOSITORY" --title "Release $NAME" --notes-file notes.md
          else
            gh release create "$NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Release $NAME" --notes-file notes.md base/* dev/*
          fi

  # ── container: the dev rootfs as an image on ghcr.io ────────────────────────
  # Per host, on a runner of its architecture: import, push <tag>-<arch>, test.
  container:
    name: Container (${{ matrix.arch }})
    needs: [find, base, dev, retag]
    if: >-
      !cancelled() && needs.find.result == 'success' &&
      (github.ref_type == 'tag' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      github.event_name != 'pull_request' &&
      (github.ref_type != 'tag' || needs.retag.result == 'success') &&
      (needs.find.outputs.run-id != '' ||
       (needs.base.result == 'success' && needs.dev.result == 'success'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGE: ghcr.io/stan-kondrat/linux-libre-vm-dev
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
      RUN: ${{ needs.find.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: rootfs/
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      # A tag: the checksum of the .img.xz the release carries (written by
      # `retag`), not the one of the build it was made from
      - uses: actions/download-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: tagged-sha-${{ matrix.arch }}
          path: tagged/
      - name: Import
        run: |
          zstd -d --rm rootfs/rootfs-dev-${{ matrix.arch }}.tar.zst
          # sha256 of the matching .img.xz (name:hash for each part when split)
          f=rootfs/img.sha256; [ -f tagged/img.sha256 ] && f=tagged/img.sha256
          if [ "$(wc -l < $f)" = 1 ]; then sha=$(cut -d' ' -f1 $f)
          else sha=$(awk '{ printf "%s%s:%s", s, $2, $1; s = "," }' $f); fi
          IMG_SHA=$sha REVISION=$GITHUB_SHA \
            scripts/container-import.sh rootfs/rootfs-dev-${{ matrix.arch }}.tar ${{ matrix.arch }} "$TAG"
          rm -rf rootfs
          docker image inspect "$IMAGE:$TAG-${{ matrix.arch }}" --format '{{json .Config.Labels}}'
      - name: Test as root and as uid 1000
        run: |
          for u in 0:0 1000:1000; do
            docker run --rm --user $u -v "$PWD/scripts:/t:ro" "$IMAGE:$TAG-${{ matrix.arch }}" \
              sh /t/container-test.sh "$TAG"
          done
      - name: Push
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG-${{ matrix.arch }}"

  # The image as a job container, the way other projects use it: the runner
  # mounts its node into it for actions/checkout
  container-test:
    name: Job container (${{ matrix.arch }})
    needs: [find, container]
    if: ${{ !cancelled() && needs.container.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/stan-kondrat/linux-libre-vm-dev:${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}-${{ matrix.arch }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: scripts/container-test.sh "${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}"

  # ── container-manifest: one multi-arch tag ──────────────────────────────────
  container-manifest:
    name: Container ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }} (multi-arch)
    needs: [find, container, container-test]
    if: ${{ !cancelled() && needs.container-test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/stan-kondrat/linux-libre-vm-dev
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
    steps:
      - name: Login
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Join the per-arch images
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-arm64" "$IMAGE:$TAG-x86_64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
