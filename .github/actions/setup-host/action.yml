# Host setup shared by the workflows: free disk space, build packages,
# QEMU with KVM. Each part is optional.
name: Set up build host
description: Free disk space, install build packages, QEMU with KVM

inputs:
  free-disk:
    description: Remove preinstalled SDKs (~30 GB) first
    default: "false"
  build:
    description: Install the userland/kernel build packages
    default: "false"
  toolchain:
    description: Install the packages the toolchain builds need
    default: "false"
  qemu:
    description: Install QEMU and make /dev/kvm usable (when present)
    default: "false"

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/share/swift || true
        df -h /home/runner

    - name: Install packages
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
        TOOLCHAIN: ${{ inputs.toolchain }}
        QEMU: ${{ inputs.qemu }}
      run: |
        p=
        [ "$BUILD" = true ] && p="$p make gcc g++ ccache autoconf automake libtool gettext texinfo
          patch xz-utils rsync bc bison flex perl pkg-config elfutils libelf-dev libncurses-dev
          e2fsprogs file"
        [ "$TOOLCHAIN" = true ] && p="$p make gcc g++ bison flex gawk m4 texinfo perl python3
          xz-utils bzip2 file e2fsprogs"
        [ "$QEMU" = true ] && p="$p qemu-system-x86 qemu-system-arm python3 openssh-client"
        [ -n "$p" ] || exit 0
        sudo apt-get update -qq
        # shellcheck disable=SC2086
        sudo apt-get install -y -qq $p

    - name: KVM
      if: inputs.qemu == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
          sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm || true
        ls -l /dev/kvm 2>/dev/null || echo "no /dev/kvm: QEMU uses TCG (slower)"
